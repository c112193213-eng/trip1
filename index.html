<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>沖繩三日小旅行</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFFCF6;--ink:#3E3A39;--coral:#F2A497;--yellow:#F6D27A;--sky:#A8D3E6;--green:#B9DAA5;
  --line:3px solid var(--ink);--r:24px;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--nh,92px) + 8px)}
*{box-sizing:border-box}
body{margin:0;background:var(--paper) url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='64' height='64'><circle cx='16' cy='16' r='5' fill='%23F2A497' fill-opacity='.45'/><circle cx='48' cy='48' r='5' fill='%23A8D3E6' fill-opacity='.6'/><circle cx='48' cy='16' r='3' fill='%23F6D27A' fill-opacity='.7'/><circle cx='16' cy='48' r='3' fill='%23B9DAA5' fill-opacity='.7'/></svg>");color:var(--ink);font-family:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.6;font-size:16px}
nav{position:fixed;top:0;left:0;right:0;z-index:20;background:var(--paper);border-bottom:var(--line);padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 10px}
.brand{display:flex;align-items:center;gap:8px;font-size:19px;font-weight:700;letter-spacing:1px;white-space:nowrap}
.logo{width:36px;height:36px;flex:0 0 36px;overflow:hidden;border-radius:50%}
.menu{display:flex;gap:5px;margin-left:auto}
@media (max-width:560px){.brand{flex:0 0 100%}}
nav a{color:var(--ink);text-decoration:none;font-size:16px;padding:5px 11px;border:var(--line);border-radius:999px;background:var(--paper);white-space:nowrap}
.menu a:nth-child(1){background:var(--coral)}.menu a:nth-child(2){background:var(--yellow)}.menu a:nth-child(3){background:var(--sky)}.menu a:nth-child(4){background:var(--green)}.menu a:nth-child(5){background:var(--coral)}
nav a:active{transform:scale(.94)}
main{max-width:560px;margin:0 auto;padding:calc(var(--nh,92px) + 14px) 16px 40px}
section{margin-top:28px}
h2{font-size:21px;margin:0 0 12px;display:inline-block;background:var(--yellow);border:var(--line);border-radius:999px;padding:2px 16px}
.card{background:var(--paper);border:var(--line);border-radius:var(--r);padding:16px}
.hero{padding:0;overflow:hidden;background:var(--sky)}
.hero svg{display:block;width:100%;height:auto}
.hero-text{background:var(--paper);border-top:var(--line);padding:14px 16px;text-align:center}
.hero-text h1{margin:0;font-size:28px;letter-spacing:2px}
.hero-text p{margin:4px 0 10px;font-size:19px}
.count{display:inline-flex;align-items:baseline;gap:6px;background:var(--coral);border:var(--line);border-radius:20px;padding:4px 18px}
.count b{font-size:34px;line-height:1.2}
.dateset{margin-top:10px;font-size:14px}
input[type=date],input[type=text]{font:inherit;color:var(--ink);background:var(--paper);border:var(--line);border-radius:14px;padding:4px 10px;max-width:100%}
.fl+.fl{border-top:3px dashed var(--ink);margin-top:14px;padding-top:6px}
.flight.go{background:var(--sky)}.flight.back{background:var(--yellow)}
.flight+.flight{margin-top:14px}
.go .dash span{background:var(--sky)}.back .dash span{background:var(--yellow)}
.flight .route div{font-size:14px}
.flight .route{margin-top:10px;display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:center}
.flight .route div{flex:0 0 auto}
.flight .code{font-size:30px;font-weight:700;display:block;line-height:1.1}
.flight .mid{flex:1;min-width:0}
.dash{border-top:3px dashed var(--ink);position:relative;margin:0 4px}
.dash span{position:absolute;left:50%;top:-14px;transform:translateX(-50%);background:var(--paper);padding:0 4px;font-size:20px}
.pill{display:inline-block;border:var(--line);border-radius:999px;padding:0 10px;font-size:13px;margin:8px 6px 0 0}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:2px 2px 6px}
.tabs button{font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:var(--line);border-radius:20px;padding:8px 4px;cursor:pointer;line-height:1.3}
.tabs button small{display:block;font-size:13px}
.tabs button[aria-selected=true]{background:var(--coral);box-shadow:0 4px 0 var(--ink);transform:translateY(-3px)}
#panel{margin-top:16px}
.pop{animation:pop .55s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.88) translateY(14px);opacity:0}100%{transform:none;opacity:1}}
.dayhead{display:flex;align-items:center;gap:10px;margin:0 0 14px}
.dayhead svg{flex:0 0 64px;width:64px;height:64px}
.dayhead h3{margin:0;font-size:19px;line-height:1.3}
.tl{list-style:none;margin:0;padding:0 0 0 22px;position:relative}
.tl::before{content:"";position:absolute;left:7px;top:8px;bottom:8px;border-left:3px dashed var(--ink)}
.tl li{position:relative;margin-bottom:14px}
.tl li::before{content:"";position:absolute;left:-22px;top:14px;width:16px;height:16px;border:var(--line);border-radius:50%;background:var(--yellow)}
.tl li.must::before{background:var(--coral)}
.tl .card{padding:12px 14px;cursor:pointer;transition:transform .25s cubic-bezier(.3,1.6,.5,1),box-shadow .2s,translate .25s ease-out;position:relative}
.tl .card::after{content:"詳細 ›";position:absolute;right:12px;bottom:8px;font-size:12px;background:var(--yellow);border:2px solid var(--ink);border-radius:999px;padding:0 8px}
.tl .card p{padding-bottom:20px}
.tl .card:focus-visible{outline:3px dashed var(--ink);outline-offset:3px}
@media (hover:hover){.tl .card:hover{transform:translateY(-3px);box-shadow:3px 4px 0 var(--ink)}
.menu a:hover,.tabs button:hover{transform:translateY(-3px)}.tabs button[aria-selected=true]:hover{transform:translateY(-4px)}}
.tl .card:active{transform:scale(.97)}
.menu a,.tabs button{transition:transform .25s cubic-bezier(.3,1.6,.5,1),translate .25s ease-out,box-shadow .2s}
.tabs button:active{transform:scale(.95)!important}
.ov{position:fixed;inset:0;z-index:50;background:rgba(62,58,57,.45);display:grid;place-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.ov[hidden]{display:none}
.modal{position:relative;background:var(--paper);border:var(--line);border-radius:var(--r);width:100%;max-width:480px;max-height:100%;overflow:auto;padding:18px;animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.modal h3{margin:0 36px 6px 0;font-size:21px;line-height:1.35}
.modal .when{display:inline-block;background:var(--yellow);border:var(--line);border-radius:999px;padding:0 12px;font-size:13px;margin-bottom:10px}
.modal .x{position:absolute;right:12px;top:12px;width:34px;height:34px;border:var(--line);border-radius:50%;background:var(--coral);font:inherit;color:var(--ink);cursor:pointer;line-height:1}
.modal p{margin:10px 0;font-size:18px;line-height:1.6}
.modal .go{display:inline-block;margin:4px 0 12px;background:var(--green);border:var(--line);border-radius:999px;padding:4px 16px;color:var(--ink);text-decoration:none;font-size:15px}

.tl h4{margin:0 0 4px;font-size:17px}
.tl p{margin:6px 0 0;font-size:17px;line-height:1.6}
.tag{display:inline-block;border:var(--line);border-radius:999px;padding:0 10px;font-size:12.5px;margin-right:6px;vertical-align:middle}
.t-fly{background:var(--sky)}.t-rail{background:var(--yellow)}.t-walk{background:var(--green)}.t-bus{background:var(--coral)}.t-taxi{background:var(--paper)}
.rec-b{display:inline-block;background:var(--sky);border:var(--line);border-radius:10px;padding:0 8px;font-size:12px;transform:rotate(3deg);margin-left:6px;vertical-align:middle}
.must-b{display:inline-block;background:var(--coral);border:var(--line);border-radius:10px;padding:0 8px;font-size:12px;transform:rotate(-4deg);margin-left:6px;vertical-align:middle}
.todo{list-style:none;margin:0;padding:0}
.todo li{margin:0}
.todo label{display:flex;align-items:center;gap:12px;padding:9px 0;cursor:pointer;border-bottom:2px dotted var(--ink)}
.todo li:last-child label{border-bottom:0}
.todo input{appearance:none;-webkit-appearance:none;flex:0 0 28px;width:28px;height:28px;border:var(--line);border-radius:9px;background:var(--paper);margin:0;display:grid;place-items:center;cursor:pointer}
.todo input:checked{background:var(--green)}
.todo input:checked::after{content:"";width:6px;height:13px;border:solid var(--ink);border-width:0 3px 3px 0;transform:rotate(40deg) translate(-1px,-1px)}
.todo input:checked+span{text-decoration:line-through;opacity:.55}
.bar{height:16px;border:var(--line);border-radius:999px;overflow:hidden;margin-bottom:8px}
.bar i{display:block;height:100%;width:0;background:var(--green);border-right:var(--line);transition:width .4s}
.stay label{display:block;font-size:14px;margin-top:10px}
.stay input{width:100%;margin-top:4px}
footer{text-align:center;font-size:13px;margin-top:30px}
.dates{margin:0 0 12px;font-size:19px}
.drop{display:grid;place-items:center;min-height:180px;border:3px dashed var(--ink);border-radius:20px;cursor:pointer;text-align:center;padding:12px;margin-top:6px;font-size:14px}
.drop img{max-width:100%;border:var(--line);border-radius:16px;display:block}
.shotbtn{font:inherit;font-size:13px;color:var(--ink);background:var(--yellow);border:var(--line);border-radius:999px;padding:2px 12px;margin:8px 8px 0 0;cursor:pointer}
.sway{animation:sway 4s ease-in-out infinite;transform-origin:50% 100%;transform-box:fill-box}
.sh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.sh h2{margin:0}
/* motion */
.plane{animation:fly 9s linear infinite}
@keyframes fly{0%{transform:translate(-90px,16px)}50%{transform:translate(160px,-6px)}100%{transform:translate(460px,16px)}}
.cloud1{animation:drift 14s ease-in-out infinite alternate}
.cloud2{animation:drift 18s ease-in-out infinite alternate-reverse}
@keyframes drift{from{transform:translateX(-14px)}to{transform:translateX(18px)}}
.sun{transform-origin:290px 40px;animation:bob 5s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(5px) scale(1.05)}}
.wave{animation:wave 3.5s ease-in-out infinite alternate}
.wave2{animation-delay:-1.7s}
@keyframes wave{from{transform:translateX(-10px)}to{transform:translateX(10px)}}
.bobber{animation:sway 3s ease-in-out infinite;transform-origin:50% 100%}
@keyframes sway{50%{transform:rotate(3deg)}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<nav aria-label="主選單"><div class="brand"><svg class="logo" viewBox="0 0 40 40" aria-hidden="true" stroke="#3E3A39" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="20" cy="20" r="17" fill="#A8D3E6"/><circle cx="14" cy="14" r="5" fill="#F6D27A"/><g class="wave" fill="none"><path d="M6 25q4-4 8 0t8 0t8 0t8 0"/><path d="M6 31q4-4 8 0t8 0t8 0t8 0"/></g></svg>Okinawa 慢活小旅行</div><div class="menu">
  <a href="#top">首頁</a><a href="#prep">準備</a><a href="#flight">航班</a><a href="#stay">住宿</a><a href="#plan">行程</a></div>
</nav>
<main id="top">

<div class="card hero">
<svg viewBox="0 0 360 150" role="img" aria-label="沖繩海邊插圖：沙灘、海、帆船與棕櫚樹" stroke="#3E3A39" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
  <rect width="360" height="150" fill="#FFFCF6" stroke="none"/>
  <g class="sun"><circle cx="290" cy="40" r="18" fill="#F6D27A"/></g>
  <g class="cloud1"><path d="M30 56h60a14 14 0 0 0-5-26 18 18 0 0 0-34-3 16 16 0 0 0-21 29z" fill="#FFFCF6"/></g>
  <g class="plane"><g transform="translate(0,-14)">
    <path d="M10 28h58q14 0 14 7t-14 7H18q-8 0-8-14z" fill="#FFFCF6"/>
    <path d="M36 30l-12-20h12l16 20zM36 40l-12 18h12l14-18z" fill="#F2A497"/>
    <path d="M10 28l-4-12h10l6 12z" fill="#F2A497"/>
  </g></g>
  <rect y="70" width="360" height="52" fill="#A8D3E6"/>
  <path d="M0 70H360" fill="none"/>
  <g class="bobber" style="transform-origin:210px 94px">
    <path d="M210 62v26h-18z" fill="#FFFCF6"/><path d="M214 68v20h14z" fill="#F2A497"/>
    <path d="M188 90h44l-7 9h-30z" fill="#F6D27A"/>
  </g>
  <g fill="none"><path class="wave" d="M-20 90q15-7 30 0t30 0t30 0t30 0t30 0t30 0t30 0t30 0t30 0t30 0t30 0t30 0t30 0"/><path class="wave wave2" d="M-20 104q15-7 30 0t30 0t30 0t30 0t30 0t30 0t30 0t30 0t30 0t30 0t30 0t30 0t30 0"/></g>
  <path d="M0 114Q90 98 190 110T360 104V150H0z" fill="#F6D27A"/>
  <g class="sway" style="transform-origin:58px 142px"><path d="M52 144Q62 112 52 84L60 82Q72 112 66 144z" fill="#FFFCF6"/>
    <ellipse cx="38" cy="86" rx="16" ry="6" transform="rotate(-22 38 86)" fill="#B9DAA5"/><ellipse cx="74" cy="84" rx="16" ry="6" transform="rotate(22 74 84)" fill="#B9DAA5"/><ellipse cx="56" cy="70" rx="6" ry="15" fill="#B9DAA5"/></g>
  <path d="M292 144V98" fill="none"/>
  <path d="M262 100Q292 70 322 100z" fill="#F2A497"/>
  <path d="M284 84Q292 77 300 84L298 100H286z" fill="#FFFCF6"/>
  <path d="M150 124l3 7h7l-5 5 2 7-7-4-7 4 2-7-5-5h7z" fill="#F2A497" stroke-width="2.5"/>
</svg>
<div class="hero-text">
  <h1>沖繩七日自由行</h1>
  <p>高雄-那霸</p>
  <p class="dates">2027/02/11 ～ 2027/02/17</p>
</div>
</div>

<section id="prep">
  <div class="sh"><h2>出發前待辦</h2></div>
  <div class="card">
    <div class="bar" aria-hidden="true"><i id="prog"></i></div>
    <div id="progTxt" style="font-size:14px;margin-bottom:4px"></div>
    <ul class="todo" id="todo"></ul>
  </div>
</section>
<section id="flight">
  <div class="sh"><h2>航班資訊</h2></div>
  <div class="card flight go">
    <div><span class="pill" style="background:var(--paper)">2/11 去程</span><span class="pill" style="background:var(--paper)">星宇航空 STARLUX</span></div>
    <div class="route">
      <div><span class="code">KHH</span>高雄小港機場</div>
      <div class="mid"><div class="dash"><span>✈</span></div></div>
      <div><span class="code">OKA</span>沖繩那霸機場</div>
    </div>
  </div>
  <div class="card flight back">
    <div><span class="pill" style="background:var(--paper)">2/17 回程</span><span class="pill" style="background:var(--paper)">星宇航空 STARLUX</span></div>
    <div class="route">
      <div><span class="code">OKA</span>沖繩那霸機場</div>
      <div class="mid"><div class="dash"><span>✈</span></div></div>
      <div><span class="code">KHH</span>高雄小港機場</div>
    </div>
  </div>
  <p style="font-size:14px;margin:12px 4px 0">航班編號與起降時間請依訂位紀錄補上。</p>
</section>
<section id="stay">
  <div class="sh"><h2>住宿資訊</h2></div>
  <div class="card stay">
    <svg viewBox="0 0 80 50" width="80" height="50" aria-hidden="true" stroke="#3E3A39" stroke-width="3" stroke-linejoin="round" style="display:block"><rect x="14" y="14" width="52" height="32" rx="6" fill="#A8D3E6"/><path d="M8 18l32-14 32 14z" fill="#F2A497"/><rect x="33" y="28" width="14" height="18" fill="#F6D27A"/></svg>
    <label>飯店名稱<input type="text" data-k="hn" placeholder="填入飯店名稱"></label>
    <label>地址／最近車站<input type="text" data-k="ha" placeholder="例：單軌電車 ○○站"></label>
    <label>入住・退房日期<input type="text" data-k="hd" placeholder="例：2/11 入住"></label>
    <label>訂房畫面</label>
    <label class="drop" id="drop" for="shotIn"><span id="shotHint">點這裡放上訂房截圖<br><small>（之後再放也可以）</small></span></label>
    <input type="file" accept="image/*" id="shotIn" hidden>
    <div id="shotBtns" hidden><label class="shotbtn" for="shotIn" style="display:inline-block">更換圖片</label><button class="shotbtn" id="shotDel" type="button">移除</button></div>
  </div>
</section>
<section id="plan">
  <div class="sh"><h2>每日行程</h2></div>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div id="panel" role="tabpanel"></div>
</section>
<footer>いってらっしゃい ✿ 旅途愉快</footer>
</main>

<div class="ov" id="ov" hidden><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><button class="x" id="mx" type="button" aria-label="關閉">✕</button><div id="mb"></div></div></div>
<script>
var DAYS=[
{n:"第一天",date:"2/11 四",title:"高雄 ✈ 那霸",icon:"plane",items:[
 {"t": "高雄機場 → 那霸機場", "tags": [["飛機", "fly"]], "nomap": 1, "note": "準備好護照和Visit Japan Web", "detail": "開開心心出門度假~旅途順遂!"},
 {"t": "飯店", "tags": [["單軌電車", "rail"]], "note": "先辦理入住和放行李，肚子餓餓去吃完餐。"},
 {"t": "暖暮拉麵", "tags": [["步行", "walk"], ["單軌電車", "rail"]], "note": "依飯店位置步行或搭單軌電車前往。熱門店家可能要排隊，出發前先確認營業時間。"}]},
{n:"第二天",date:"2/12 五",title:"瀨長島",icon:"sea",items:[
 {"t": "飯店 → 瀨長島", "tags": [["巴士", "bus"], ["計程車", "taxi"]], "note": "可從國際通搭東京巴士的「ウミカジライナー」前往，也可搭計程車。平日班次較少，請先查最新時刻，備案用計程車。"},
 {"t": "瀨長島海風露台", "tags": [["步行", "walk"]], "note": "白色建築像沖繩小希臘。這裡吃幸福鬆餅和蝦蝦飯，邊看海邊逛街。"},
 {"t": "瀨長島日落公園", "tags": [["步行", "walk"]], "rec": 1, "note": "就在島上，順路走過去。位在小山丘上，視野開闊，可以看飛機起降，傍晚還能看夕陽。"},
 {"t": "回飯店", "tags": [["巴士", "bus"], ["計程車", "taxi"]], "note": "原路搭巴士或計程車回那霸市區，再依飯店位置搭單軌電車或步行。"}]},
{n:"第三天",date:"2/13 六",title:"首里城・識名園・達摩寺",icon:"castle",items:[
 {"t": "飯店 → 首里城", "tags": [["單軌電車", "rail"], ["步行", "walk"]], "note": "從飯店搭 Yui Rail 到終點「首里站」，再步行約 15 分鐘上坡到首里城。"},
 {"t": "首里城", "tags": [["步行", "walk"]], "must": 1, "note": "首里城正殿預計 2026 年秋季復原開放，出發前請確認開放區域和門票。"},
 {"t": "達摩寺（だるま寺 西來院）", "tags": [["步行", "walk"]], "note": "位在首里城附近，從首里城步行前往，實際時間請用 Google Maps 查。順路逛完再往南走。"},
 {"t": "識名園", "tags": [["巴士", "bus"]], "note": "從首里城附近搭 14 號巴士到「識名園前」站，下車步行約 1 分鐘。入園約 400 日圓，週三公休，今天剛好週六沒問題。"},

var TODO=["確認護照效期（建議 6 個月以上）","完成 Visit Japan Web 入境登錄","確認機票與星宇航空電子登機證","購買旅遊平安險／海外醫療保險","準備網卡／eSIM／漫遊","換日幣與備好信用卡","行李整理：轉接頭、行動電源","準備交通卡","預訂住宿並截圖確認信","預定餐廳並截圖確認信","備份重要文件：護照影本、機票、訂房截圖","準備個人常備藥品與處方箋"];
var store={get:function(k){try{return localStorage.getItem(k)}catch(e){return null}},set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

/* tabs */
var tabs=document.getElementById("tabs"),panel=document.getElementById("panel");
DAYS.forEach(function(d,i){
  var b=document.createElement("button");b.setAttribute("role","tab");b.innerHTML="Day "+(i+1)+"<small>"+d.date+"</small>";
  b.onclick=function(){show(i)};tabs.appendChild(b);
});
var cur=0;
function show(i){
  cur=i;var d=DAYS[i];
  [].forEach.call(tabs.children,function(b,j){b.setAttribute("aria-selected",j===i)});
  var h='<div class="dayhead">'+ICONS[d.icon]+'<h3>'+d.n+'・'+d.date+'<br>'+d.title+'</h3></div><ul class="tl">';
  d.items.forEach(function(it,k){
    h+='<li'+(it.must?' class="must"':'')+'><div class="card" role="button" tabindex="0" data-k="'+k+'"><h4>'+it.t+(it.must?'<span class="must-b">必去</span>':'')+(it.rec?'<span class="rec-b">推薦</span>':'')+'</h4>'+
    it.tags.map(function(g){return '<span class="tag t-'+g[1]+'">'+g[0]+'</span>'}).join('')+'<p>'+it.note+'</p></div></li>';
  });
  panel.innerHTML=h+'</ul>';
  panel.classList.remove("pop");void panel.offsetWidth;panel.classList.add("pop");
}
show(0);

/* card detail */
var MAPQ=[["暖暮","暖暮拉麵 那覇"],["海風露台","瀬長島ウミカジテラス"],["日落公園","瀬長島サンセットパーク"],["首里城","首里城公園"],["達摩寺","だるま寺 西来院 那覇"],["識名園","識名園"],["波上宮","波上宮"],["ASHIBINAA","沖縄アウトレットモールあしびなー"],["牧志市場","牧志公設市場"],["國際通","国際通り 那覇"],["DMM","DMMかりゆし水族館"],["百貨","那覇メインプレイス"],["機場","那覇空港"]];
function mapQ(t){for(var i=0;i<MAPQ.length;i++)if(t.indexOf(MAPQ[i][0])>-1)return MAPQ[i][1];return null}
var ov=document.getElementById("ov"),mb=document.getElementById("mb"),lastCard=null;
function openCard(k,el){
  var d=DAYS[cur],it=d.items[k],q=mapQ(it.t);
  lastCard=el;
  mb.innerHTML='<span class="when">'+d.n+'・'+d.date+'</span><h3 id="mt">'+it.t+(it.must?'<span class="must-b">必去</span>':'')+(it.rec?'<span class="rec-b">推薦</span>':'')+'</h3>'+
    '<div>'+it.tags.map(function(g){return '<span class="tag t-'+g[1]+'">'+g[0]+'</span>'}).join('')+'</div>'+
    '<p>'+(it.detail||it.note)+'</p>'+
    (q&&!it.nomap?'<a class="go" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q)+'">在 Google 地圖查看 ↗</a>':'');
  ov.hidden=false;document.body.style.overflow="hidden";document.getElementById("mx").focus();
}
function closeCard(){ov.hidden=true;document.body.style.overflow="";if(lastCard)lastCard.focus()}
panel.addEventListener("click",function(e){var c=e.target.closest(".card[data-k]");if(c)openCard(+c.dataset.k,c)});
panel.addEventListener("keydown",function(e){if((e.key==="Enter"||e.key===" ")&&e.target.matches(".card[data-k]")){e.preventDefault();openCard(+e.target.dataset.k,e.target)}});
document.getElementById("mx").onclick=closeCard;
ov.addEventListener("click",function(e){if(e.target===ov)closeCard()});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!ov.hidden)closeCard()});

/* cards lean toward a nearby pointer */
if(window.matchMedia&&matchMedia("(hover:hover) and (prefers-reduced-motion:no-preference)").matches){
  var raf=0,px=0,py=0;
  document.addEventListener("pointermove",function(e){px=e.clientX;py=e.clientY;if(raf)return;raf=requestAnimationFrame(function(){
    raf=0;[].forEach.call(document.querySelectorAll(".tl .card,.menu a,.tabs button"),function(c){
      var r=c.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=px-cx,dy=py-cy,dist=Math.sqrt(dx*dx+dy*dy);
      if(dist<110&&dist>0){var f=(1-dist/110)*2.5;c.style.translate=(dx/dist*f).toFixed(1)+"px "+(dy/dist*f).toFixed(1)+"px"}else c.style.translate="";
    });
  })});
}

/* hotel screenshot */
var shotIn=document.getElementById("shotIn"),drop=document.getElementById("drop"),sb=document.getElementById("shotBtns");
function showShot(src){
  if(src){drop.innerHTML='<img alt="訂房畫面" src="'+src+'">';sb.hidden=false}
  else{drop.innerHTML='<span id="shotHint">點這裡放上訂房截圖<br><small>（之後再放也可以）</small></span>';sb.hidden=true}
}
showShot(store.get("okw-shot"));
shotIn.onchange=function(){
  var f=shotIn.files[0];if(!f)return;
  var img=new Image(),url=URL.createObjectURL(f);
  img.onload=function(){
    var m=900,r=Math.min(1,m/Math.max(img.width,img.height)),c=document.createElement("canvas");
    c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    var d=c.toDataURL("image/jpeg",.75);URL.revokeObjectURL(url);showShot(d);store.set("okw-shot",d);
  };
  img.src=url;shotIn.value="";
};
document.getElementById("shotDel").onclick=function(){showShot(null);try{localStorage.removeItem("okw-shot")}catch(e){}};
